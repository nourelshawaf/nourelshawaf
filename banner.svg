<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Nour Elshawaf - Mechatronics engineer building autonomous systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b2a2e"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#3ddbd9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="sweep" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#3ddbd9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ddbd9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>

  <!-- LiDAR scope -->
  <g fill="none" stroke="#3ddbd9" stroke-opacity="0.28">
    <circle cx="820" cy="130" r="30"/>
    <circle cx="820" cy="130" r="60"/>
    <circle cx="820" cy="130" r="90"/>
    <circle cx="820" cy="130" r="120"/>
    <path d="M700 130H940M820 10V250" stroke-dasharray="3 5"/>
  </g>

  <!-- rotating sweep -->
  <g>
    <path d="M820 130 L940 130 A120 120 0 0 0 923.9 70 Z" fill="url(#sweep)" transform="translate(820 130) scale(1) translate(-820 -130)"/>
    <line x1="820" y1="130" x2="940" y2="130" stroke="#3ddbd9" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" from="0 820 130" to="360 820 130" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- point cloud -->
  <g fill="#7dfbf0">
    <circle cx="763.6" cy="109.5" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="770.8" cy="96.7" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="780.5" cy="81.7" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="904.6" cy="160.8" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="893.7" cy="181.6" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="877.9" cy="198.9" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="840.8" cy="11.8" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="870.7" cy="21.3" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="897.1" cy="38.1" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="751.1" cy="187.9" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="738.5" cy="168.1" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="799.2" cy="248.2" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="769.2" cy="238.7" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" begin="4.2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="820" cy="130" r="5" fill="#3ddbd9"/>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="82" font-size="14" letter-spacing="4" fill="#3ddbd9" font-family="ui-monospace, Menlo, Consolas, monospace">&gt; MECHATRONICS ENGINEER</text>
    <text x="48" y="140" font-size="54" font-weight="700" fill="#ffffff">Nour Elshawaf</text>
    <text x="48" y="178" font-size="22" fill="#c9d1d9">Building autonomous systems</text>
    <text x="48" y="214" font-size="14" letter-spacing="1.5" fill="#8b949e" font-family="ui-monospace, Menlo, Consolas, monospace">PERCEPTION · SLAM · EMBEDDED · ROBOTICS</text>
  </g>
</svg>
